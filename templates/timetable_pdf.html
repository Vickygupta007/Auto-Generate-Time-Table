<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timetable PDF</title>
    <style>
        body { font-family: Arial, sans-serif; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 8px; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>

<h2>College Timetable</h2>

<table>
    <tr>
        <th>Day</th>
        <th>Time</th>
        <th>Subject</th>
        <th>Teacher</th>
        <th>Room</th>
    </tr>

    {% for r in rows %}
    <tr>
        <td>{{ r.day }}</td>
        <td>
            {% if r.period == 1 %}10:00–12:00{% endif %}
            {% if r.period == 2 %}12:00–02:00{% endif %}
            {% if r.period == 3 %}03:00–05:00{% endif %}
        </td>
        <td>{{ r.subject }}</td>
        <td>{{ r.teacher }}</td>
        <td>{{ r.room }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
